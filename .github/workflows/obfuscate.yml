# ============================================================
# ob_cfn · 每日自动混淆 CFNext 明文版 -> _worker.js
#
# 放置位置：ob_cfn 仓库根目录下的 .github/workflows/obfuscate.yml
#
# 混淆逻辑（2026-09-20 按用户要求调整）：
#   完全复用 scanda-obf/.github/workflows/obfuscate.yml 的固定参数集
#   （control-flow-flattening 0.75 / dead-code-injection 0.4 /
#    hexadecimal 标识符 / string-array rc4 / transform-object-keys /
#    unicode-escape-sequence / split-strings chunk 5），
#   不采用 PAICNI/CFNext 自带"混淆版"的浅混淆逻辑
#   （其产物仍保留大量可读的页面 HTML/JS 与中文文案，易被特征指纹识别）。
#
# 与 scanda-obf 参考的差异：
#   1) 上游源改为 PAICNI/CFNext 的 "CFNext明文版.js"（每日拉取最新）
#   2) 产物命名为 _worker.js，提交到仓库根目录（Pages 单文件 Worker 约定）
#   3) 新增 esbuild bundle 校验门禁（与 wrangler 相同的检查）：
#      杜绝"给 const 常量重新赋值"等非法代码被提交导致 Pages 构建失败
# ============================================================
name: 🔐 Obfuscate CFNext Worker

on:
  schedule:
    # 每个自然日自动执行：UTC 22:00 = 北京时间 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:

# 授予本工作流对仓库内容的写权限（GITHUB_TOKEN）
# 这是定时任务能自动提交的关键：缺少此权限 push 会失败
permissions:
  contents: write

# 防止定时触发与手动触发重叠执行
concurrency:
  group: obfuscate-cfnext
  cancel-in-progress: false

jobs:
  obfuscate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # persist-credentials 默认为 true：
          # GITHUB_TOKEN 已写入 git 凭据，供后续 commit/push 使用

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "latest"

      - name: 📦 Install javascript-obfuscator + esbuild
        run: |
          npm install javascript-obfuscator esbuild --no-fund --no-audit

      - name: ⬇️ Download latest CFNext plain source
        run: |
          # 该地址与上游源码内 UPDATE_RAW_URL 完全一致，已实测可下载
          curl -sL -o source.js \
            "https://raw.githubusercontent.com/PAICNI/CFNext/main/CFNext%20%E6%98%8E%E6%96%87%E7%89%88.js"
          echo "Downloaded source.js ($(wc -c < source.js) bytes)"

      - name: 🔐 Obfuscate with scanda-obf parameter set
        run: |
          cat > obfuscate.js <<'EOF'
          const fs = require('fs');
          const JSO = require('javascript-obfuscator');

          const source = fs.readFileSync('source.js', 'utf8');

          // 与 scanda-obf/.github/workflows/obfuscate.yml 完全一致的参数
          const options = {
            compact: true,
            controlFlowFlattening: true,
            controlFlowFlatteningThreshold: 0.75,
            deadCodeInjection: true,
            deadCodeInjectionThreshold: 0.4,
            identifierNamesGenerator: 'hexadecimal',
            renameGlobals: false,
            stringArray: true,
            stringArrayEncoding: ['rc4'],
            stringArrayThreshold: 0.75,
            transformObjectKeys: true,
            unicodeEscapeSequence: true,
            splitStrings: true,
            splitStringsChunkLength: 5
          };

          const code = JSO.obfuscate(source, options).getObfuscatedCode();
          fs.writeFileSync('_worker.js', code);
          console.log('Obfuscated _worker.js (' + Buffer.byteLength(code) + ' bytes)');
          EOF
          node obfuscate.js

      - name: ✅ Verify output (esbuild bundle + export)
        run: |
          if [ ! -s _worker.js ]; then
            echo "❌ _worker.js is empty!"
            exit 1
          fi
          # 与 Cloudflare Pages/wrangler 相同的 esbuild bundle 校验，
          # 防止"给 const 常量重新赋值"等非法代码导致构建失败
          npx esbuild _worker.js --bundle --format=esm \
            --external:cloudflare:sockets --outfile=/dev/null --log-level=error
          # 必须保留模块导出，否则 Worker 无法运行
          if ! grep -q "export default" _worker.js; then
            echo "❌ export default missing in _worker.js!"
            exit 1
          fi
          echo "✅ Obfuscation verified ($(wc -c < _worker.js) bytes)"

      - name: 📝 Commit obfuscated code
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "🔐 Auto-obfuscate: update CFNext worker"
          # 使用 GitHub 机器人身份提交，避免使用个人账号凭据
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          file_pattern: "_worker.js"
          push_options: "--force-with-lease"
